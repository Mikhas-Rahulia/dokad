<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="pin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- City Grid Abstract Lines -->
  <path d="M64 256 H448 M256 64 V448 M128 128 L384 384 M384 128 L128 384" stroke="#ffffff" stroke-opacity="0.12" stroke-width="8" stroke-dasharray="16 16" />
  <circle cx="256" cy="256" r="140" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6" fill="none" />

  <!-- Center Pin Group -->
  <g filter="url(#shadow)">
    <!-- Map Pin Shape -->
    <path d="M256 100 C189.7 100 136 153.7 136 220 C136 310 256 420 256 420 C256 420 376 310 376 220 C376 153.7 322.3 100 256 100 Z" fill="url(#pin-grad)" stroke="#ffffff" stroke-width="10" stroke-linejoin="round" />
    
    <!-- White inner circle -->
    <circle cx="256" cy="216" r="46" fill="#ffffff" />
    
    <!-- Dice Dots / Compass in the middle -->
    <circle cx="256" cy="216" r="14" fill="#4f46e5" />
    <circle cx="236" cy="196" r="7" fill="#4f46e5" />
    <circle cx="276" cy="236" r="7" fill="#4f46e5" />
  </g>
</svg>
