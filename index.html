<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Dokąd? — 2km Daily Random Explorer</title>
  
  <!-- PWA Meta Tags -->
  <meta name="description" content="Generate 3 daily random spots strictly within 2 km, navigate the shortest route on Google Maps, and build your daily streak by arriving within 100m." />
  <meta name="theme-color" content="#121826" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dokąd?" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  
  <!-- Retro Pixel Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app" class="pixel-app">
    <!-- Map Canvas -->
    <div id="map"></div>

    <!-- Retro CRT Scanlines -->
    <div class="pixel-scanline-overlay"></div>

    <!-- Top Minimal Floating Header -->
    <header class="top-header">
      <div class="brand-badge">
        <span class="brand-icon">🕹️</span>
        <span class="brand-title">DOKĄD?</span>
        <span class="radius-tag">2 KM</span>
      </div>

      <div class="header-right-group">
        <div id="header-streak-badge" class="pixel-badge streak-badge" title="Daily Streak">
          <span class="fire-icon">🔥</span>
          <span id="streak-count">0</span>
          <span class="streak-label">DAYS</span>
        </div>
        <button id="btn-locate-me" class="pixel-icon-btn" title="Center on GPS" aria-label="Center on GPS">
          <span>📍</span>
        </button>
      </div>
    </header>

    <!-- Bottom Action Drawer -->
    <div class="bottom-sheet">
      <div class="bottom-sheet-content">
        
        <!-- Active Daily Tour Card -->
        <div id="tour-card" class="pixel-card tour-card" style="display: none;">
          <div class="tour-header">
            <div class="tour-status-row">
              <span id="tour-progress-badge" class="pixel-badge progress-badge">0/3 COMPLETED</span>
              <span id="tour-distance-badge" class="pixel-sub-badge">🚶 2.4 KM TOTAL</span>
            </div>
          </div>

          <!-- 3 Spots Proximity & Check-In List -->
          <div id="spots-list" class="spots-list-container">
            <!-- Dynamically populated -->
          </div>

          <!-- Direct Optimal Google Maps Route Link -->
          <a id="btn-google-route" href="#" target="_blank" rel="noopener noreferrer" class="pixel-btn pixel-btn-main-route">
            <span class="route-icon">🗺️</span>
            <span class="route-label">GOOGLE MAPS ROUTE</span>
          </a>

          <!-- Minimal Bottom Action Bar -->
          <div class="secondary-actions-bar">
            <button id="btn-reroll-daily" class="pixel-btn pixel-btn-secondary" title="Roll 3 new spots">
              <span>🎲</span> <span>NEW 3 SPOTS</span>
            </button>
          </div>
        </div>

        <!-- Initial Roll Card (When no tour is active for today) -->
        <div id="initial-card" class="pixel-card initial-card">
          <div class="initial-card-body">
            <h2 class="initial-title">🎯 TODAY'S 2 KM TOUR</h2>
            <p class="initial-subtitle">Generate 3 random places within 2 km. Visit all 3 within 100 m to keep your daily streak!</p>
          </div>
          <button id="btn-generate-daily" class="pixel-btn pixel-btn-roll">
            <span class="dice-icon">🎲</span>
            <span>GENERATE 3 SPOTS</span>
          </button>
        </div>

      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="pixel-toast"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
